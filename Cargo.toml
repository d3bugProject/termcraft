[package]
name = "termcraft"
version = "0.1.0"
edition = "2021"
authors = ["d3bugProject"]
description = "A faithful, blazing-fast, cross-platform clean-room reimplementation of iTerm2 written in 100% pure Rust."
license = "GPL-2.0-only"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.52.0"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
]
