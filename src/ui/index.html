<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TermCraft — iTerm2 Clean-Room Reimplementation in Rust</title>
    <style>
        :root {
            --bg: #181818;
            --fg: #cccccc;
            --tab-bg: #121212;
            --tab-active: #1e1e1e;
            --accent: #2f81f7;
            --border: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg);
            color: var(--fg);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        /* macOS Window Titlebar */
        .titlebar {
            height: 38px;
            background: var(--tab-bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            flex-shrink: 0;
        }

        .window-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .traffic-light {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }

        .close { background: #ff5f56; }
        .minimize { background: #ffbd2e; }
        .maximize { background: #27c93f; }

        /* Tabs Header */
        .tabs-bar {
            display: flex;
            align-items: center;
            gap: 4px;
            flex: 1;
            margin-left: 20px;
            overflow-x: auto;
        }

        .tab-item {
            background: transparent;
            padding: 6px 14px;
            border-radius: 6px 6px 0 0;
            font-size: 0.8rem;
            color: #888;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 2px solid transparent;
            transition: all 0.15s ease;
        }

        .tab-item:hover {
            color: #ccc;
            background: rgba(255, 255, 255, 0.04);
        }

        .tab-item.active {
            color: #fff;
            background: var(--tab-active);
            border-bottom: 2px solid var(--accent);
            font-weight: 500;
        }

        .tab-close {
            font-size: 0.75rem;
            color: #777;
            padding: 1px 4px;
            border-radius: 4px;
        }

        .tab-close:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.15);
        }

        .new-tab-btn {
            background: transparent;
            border: none;
            color: #888;
            font-size: 1rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .new-tab-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
        }

        .settings-bar {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        select.preset-select {
            background: #222;
            color: #eee;
            border: 1px solid var(--border);
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 4px;
            outline: none;
            cursor: pointer;
        }

        /* Terminal Screen Canvas & Grid */
        .terminal-container {
            flex: 1;
            padding: 10px 14px;
            background: var(--bg);
            overflow-y: auto;
            position: relative;
            cursor: text;
        }

        .terminal-screen {
            font-family: "JetBrains Mono", "SF Mono", "Fira Code", "Menlo", "Courier New", monospace;
            font-size: 13px;
            line-height: 1.35;
            white-space: pre;
            tab-size: 8;
            outline: none;
        }

        .cursor {
            background-color: #c7c7c7;
            color: #000;
            animation: blink 1s step-end infinite;
            display: inline-block;
            height: 1.2em;
            vertical-align: sub;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        /* Quick Command Input Bar */
        .cmd-bar {
            height: 42px;
            background: #141414;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 14px;
            gap: 10px;
        }

        .cmd-prompt {
            color: var(--accent);
            font-weight: 600;
            font-family: monospace;
            font-size: 0.9rem;
        }

        .cmd-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-family: monospace;
            font-size: 0.9rem;
            outline: none;
        }

        .status-badge {
            font-size: 0.7rem;
            color: #4ade80;
            background: rgba(74, 222, 128, 0.1);
            padding: 2px 8px;
            border-radius: 10px;
            border: 1px solid rgba(74, 222, 128, 0.2);
        }
    </style>
</head>
<body>
    <!-- Titlebar style macOS -->
    <header class="titlebar">
        <div class="window-controls">
            <span class="traffic-light close"></span>
            <span class="traffic-light minimize"></span>
            <span class="traffic-light maximize"></span>
        </div>

        <nav class="tabs-bar" id="tabsBar">
            <div class="tab-item active" onclick="switchTab(0)">
                <span> Tab 1 (zsh)</span>
                <span class="tab-close" onclick="closeTab(0, event)">×</span>
            </div>
            <button class="new-tab-btn" onclick="addTab()" title="New Tab (⌘T)">+</button>
        </nav>

        <div class="settings-bar">
            <span class="status-badge">100% PURE RUST</span>
            <select class="preset-select" id="presetSelect" onchange="changeTheme(this.value)">
                <option value="default">iTerm2 Default</option>
                <option value="solarized">Solarized Dark</option>
                <option value="dracula">Dracula</option>
            </select>
        </div>
    </header>

    <!-- Terminal Display Area -->
    <main class="terminal-container" id="terminalContainer" onclick="focusInput()">
        <pre class="terminal-screen" id="terminalScreen"></pre>
    </main>

    <!-- Interactive Command Bar -->
    <footer class="cmd-bar">
        <span class="cmd-prompt" id="cmdPrompt">termcraft %</span>
        <input type="text" class="cmd-input" id="cmdInput" placeholder="Type command here and press Enter (e.g. ls, uname -a, top)..." autofocus autocomplete="off" />
    </footer>

    <script>
        let currentTab = 0;
        let tabs = [{ id: 1, title: 'Tab 1 (Shell)', history: [] }];

        const themes = {
            default: { bg: '#181818', fg: '#cccccc', tab: '#121212', active: '#1e1e1e' },
            solarized: { bg: '#002b36', fg: '#839496', tab: '#073642', active: '#002b36' },
            dracula: { bg: '#282a36', fg: '#f8f8f2', tab: '#191a21', active: '#282a36' }
        };

        window.addEventListener('DOMContentLoaded', () => {
            renderScreenWelcome();
            document.getElementById('cmdInput').addEventListener('keydown', handleKey);
        });

        function renderScreenWelcome() {
            const screen = document.getElementById('terminalScreen');
            const welcomeText = 
`\x1b[1;36m╔══════════════════════════════════════════════════════════════════════════════╗\x1b[0m
\x1b[1;36m║                  TermCraft — iTerm2 Reimplementation in Rust                ║\x1b[0m
\x1b[1;36m╚══════════════════════════════════════════════════════════════════════════════╝\x1b[0m
\x1b[32m[iTerm2 Architecture Port: VT100Screen + PTYTask + iTermColorMap in Pure Rust]\x1b[0m
\x1b[90mMulti-platform: macOS (zsh) • Linux (bash) • Windows (PowerShell/CMD)\x1b[0m

Type \x1b[1mhelp\x1b[0m or any shell command below to begin.
`;
            screen.innerHTML = parseAnsiToHtml(welcomeText);
        }

        function focusInput() {
            document.getElementById('cmdInput').focus();
        }

        async function handleKey(e) {
            if (e.key === 'Enter') {
                const input = document.getElementById('cmdInput');
                const cmd = input.value.trim();
                input.value = '';

                if (!cmd) return;

                if (cmd === 'clear') {
                    document.getElementById('terminalScreen').innerHTML = '';
                    return;
                }

                appendLine(`\x1b[32mtermcraft %\x1b[0m \x1b[1m${cmd}\x1b[0m`);

                // Send to backend shell execution
                try {
                    const res = await fetch('/api/exec', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ cmd, tab_id: currentTab })
                    });
                    const data = await res.json();
                    appendLine(data.output);
                } catch (err) {
                    appendLine(`\x1b[31m[TermCraft Execution Error: ${err}]\x1b[0m`);
                }

                const container = document.getElementById('terminalContainer');
                container.scrollTop = container.scrollHeight;
            }
        }

        function appendLine(ansiText) {
            const screen = document.getElementById('terminalScreen');
            screen.innerHTML += parseAnsiToHtml(ansiText) + '\n';
        }

        function addTab() {
            const id = tabs.length + 1;
            tabs.push({ id, title: `Tab ${id} (Shell)`, history: [] });
            renderTabs();
            switchTab(tabs.length - 1);
        }

        function closeTab(index, e) {
            e.stopPropagation();
            if (tabs.length > 1) {
                tabs.splice(index, 1);
                if (currentTab >= tabs.length) {
                    currentTab = tabs.length - 1;
                }
                renderTabs();
            }
        }

        function switchTab(index) {
            currentTab = index;
            renderTabs();
            renderScreenWelcome();
        }

        function renderTabs() {
            const bar = document.getElementById('tabsBar');
            bar.innerHTML = '';
            tabs.forEach((tab, i) => {
                const div = document.createElement('div');
                div.className = `tab-item ${i === currentTab ? 'active' : ''}`;
                div.onclick = () => switchTab(i);
                div.innerHTML = `
                    <span> ${tab.title}</span>
                    <span class="tab-close" onclick="closeTab(${i}, event)">×</span>
                `;
                bar.appendChild(div);
            });

            const addBtn = document.createElement('button');
            addBtn.className = 'new-tab-btn';
            addBtn.title = 'New Tab (⌘T)';
            addBtn.innerText = '+';
            addBtn.onclick = addTab;
            bar.appendChild(addBtn);
        }

        function changeTheme(themeName) {
            const t = themes[themeName] || themes.default;
            document.documentElement.style.setProperty('--bg', t.bg);
            document.documentElement.style.setProperty('--fg', t.fg);
            document.documentElement.style.setProperty('--tab-bg', t.tab);
            document.documentElement.style.setProperty('--tab-active', t.active);
        }

        function parseAnsiToHtml(text) {
            let html = text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');

            // Simple ANSI color code parser to HTML
            html = html
                .replace(/\x1b\[0m/g, '</span>')
                .replace(/\x1b\[1m/g, '<span style="font-weight: bold;">')
                .replace(/\x1b\[1;36m/g, '<span style="color: #38bdf8; font-weight: bold;">')
                .replace(/\x1b\[32m/g, '<span style="color: #4ade80;">')
                .replace(/\x1b\[31m/g, '<span style="color: #f87171;">')
                .replace(/\x1b\[90m/g, '<span style="color: #9ca3af;">');

            return html;
        }
    </script>
</body>
</html>
